name: Verify Windows installer
on:
  push:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'scripts/Build-Installer.ps1'
      - '.github/workflows/installer-check.yml'
      - 'scripts/Test-ThemedInstaller.ps1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build self-contained installer and brand assets
        shell: pwsh
        env:
          UPDATE_REPOSITORY: https://github.com/${{ github.repository }}
        run: ./scripts/Build-Installer.ps1 -Repository $env:UPDATE_REPOSITORY
      - name: Verify fresh install, repair and update from the previous installer
        shell: pwsh
        run: ./scripts/Test-ThemedInstaller.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: IMRC-Race-Control-Setup
          path: artifacts/releases/RaceControl-Installer.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: IMRC-Race-Control-Brand
          path: artifacts/branding/*
          if-no-files-found: error
