name: Publish verified Race Control 0.17.20
on:
  push:
    branches: [prepare-v0.17.15-race-flow-improvements]
    paths: ['.github/workflows/publish-v0.17.20.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish only the verified complete installer draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag=v0.17.20
          verified_sha=c50c2cb3354f57c3ebf4cb1ce21c19d2e7144ce5
          run_id=46051572299
          [[ "$(gh run view "$run_id" --repo "$GH_REPO" --json conclusion --jq .conclusion)" == success ]]
          [[ "$(gh run view "$run_id" --repo "$GH_REPO" --json headSha --jq .headSha)" == "$verified_sha" ]]
          release_id=$(gh api --paginate "repos/$GH_REPO/releases?per_page=100" | jq -ser --arg tag "$tag" 'add | map(select(.tag_name == $tag)) | if length == 1 then .[0].id else error("Expected exactly one release for the requested version") end')
          release=$(gh api "repos/$GH_REPO/releases/$release_id")
          [[ "$(jq -r .tag_name <<< "$release")" == "$tag" ]]
          [[ "$(jq -r .target_commitish <<< "$release")" == "$verified_sha" ]]
          [[ "$(jq -r .draft <<< "$release")" == true ]]
          for asset in RaceControl-Installer.exe IMRCRaceControl.App-0.17.20-full.nupkg releases.win.json RELEASES SHA256SUMS.txt; do
            jq -r '.assets[] | select(.size > 0 and .state == "uploaded") | .name' <<< "$release" | grep -Fxq "$asset"
          done
          gh api --method PATCH "repos/$GH_REPO/releases/$release_id" -F draft=false -F prerelease=false -f make_latest=true --jq '{draft,tag_name,html_url,published_at}'
          [[ "$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)" == "$tag" ]]
