name: Build draft release
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ['src/IMRCRaceControl.App/IMRCRaceControl.App.csproj', 'scripts/Build-Installer.ps1']
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate version and repository
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          [xml]$project = Get-Content src/IMRCRaceControl.App/IMRCRaceControl.App.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Project version must be major.minor.patch' }
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -ne "v$version") { throw 'Tag must match the project version' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Run regression checks
        run: dotnet run --project tests/LapCalloutChecks/LapCalloutChecks.csproj -c Release
      - name: Build Windows installer and update packages
        shell: pwsh
        env:
          UPDATE_REPOSITORY: https://github.com/${{ github.repository }}
        run: ./scripts/Build-Installer.ps1 -Repository $env:UPDATE_REPOSITORY
      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IMRC-Race-Control-Windows
          path: artifacts/releases/*
          if-no-files-found: error
      - name: Write installer instructions and changelog
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $changelog = Get-Content CHANGELOG.md -Raw
          $versionPattern = [regex]::Escape($env:RELEASE_VERSION)
          $entry = [regex]::Match($changelog,"(?ms)^##\s+$versionPattern[^\r\n]*\r?\n(?<changes>.*?)(?=^##\s|\z)")
          if (-not $entry.Success) { throw 'Add the current version to CHANGELOG.md before preparing a release' }
          $instructions = @'
          ## Install IMRC Race Control
          Download **Setup.exe** below and run it. You do not need to download or extract the other files.
          
          The remaining package/feed assets are used automatically for online updates.
          
          This release stores race data outside the installation directory, migrates surviving earlier data, and keeps automatic database backups. Version 0.16.17 users should install this new Setup.exe once; no uninstall of the old version is required before migration.
          '@
          $instructions + "`n`n## Changes in $env:RELEASE_VERSION`n" + $entry.Groups['changes'].Value.Trim() | Set-Content artifacts/ReleaseNotes.md
      - name: Create draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: https://github.com/${{ github.repository }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          $releaseJson = gh release list --repo $env:GITHUB_REPOSITORY --limit 100 --json tagName,isDraft
          if ($LASTEXITCODE -ne 0) { throw 'Could not inspect existing releases' }
          $existing = @($releaseJson | ConvertFrom-Json | Where-Object { $_.tagName -eq $tag })
          if ($existing.Count -gt 0) {
            if (-not $existing[0].isDraft) { throw 'This version is already published. Increment the version instead of replacing it.' }
            gh release edit $tag --repo $env:GITHUB_REPOSITORY --target $env:RELEASE_COMMIT --title "IMRC Race Control $env:RELEASE_VERSION" --notes-file artifacts/ReleaseNotes.md
          } else {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --draft --target $env:RELEASE_COMMIT --title "IMRC Race Control $env:RELEASE_VERSION" --notes-file artifacts/ReleaseNotes.md
          }
          if ($LASTEXITCODE -ne 0) { throw 'Draft release could not be prepared' }
          $draft = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $draft.isDraft) { throw 'Upload is allowed only to a draft release' }
          $assets = @(Get-ChildItem artifacts/releases -File | ForEach-Object { $_.FullName })
          gh release upload $tag @assets --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Draft release asset upload failed' }
          $uploaded = gh release view $tag --repo $env:GITHUB_REPOSITORY --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Could not verify uploaded assets' }
          foreach ($name in @('Setup.exe','releases.win.json','RELEASES','SHA256SUMS.txt',"IMRCRaceControl.App-$env:RELEASE_VERSION-full.nupkg")) {
            if ($name -notin $uploaded.assets.name) { throw "Release asset missing: $name" }
          }
