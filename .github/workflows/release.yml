name: Build draft release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate version and repository
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          [xml]$project = Get-Content src/IMRCRaceControl.App/IMRCRaceControl.App.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Project version must be major.minor.patch' }
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -ne "v$version") { throw 'Tag must match the project version' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Run regression checks
        run: dotnet run --project tests/LapCalloutChecks/LapCalloutChecks.csproj -c Release
      - name: Build Windows installer and update packages
        shell: pwsh
        env:
          UPDATE_REPOSITORY: https://github.com/${{ github.repository }}
        run: ./scripts/Build-Installer.ps1 -Repository $env:UPDATE_REPOSITORY
      - name: Save build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IMRC-Race-Control-Windows
          path: artifacts/releases/*
          if-no-files-found: error
      - name: Create draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPOSITORY: https://github.com/${{ github.repository }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          dotnet tool run vpk -- upload github --repoUrl $env:RELEASE_REPOSITORY --outputDir artifacts/releases --tag "v$env:RELEASE_VERSION" --releaseName "IMRC Race Control $env:RELEASE_VERSION" --targetCommitish $env:RELEASE_COMMIT --token $env:GH_TOKEN
          if ($LASTEXITCODE -ne 0) { throw 'Draft release upload failed' }
          gh release upload "v$env:RELEASE_VERSION" artifacts/releases/SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Checksum upload failed' }
